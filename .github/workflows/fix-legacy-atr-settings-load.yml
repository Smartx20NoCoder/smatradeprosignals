name: Fix legacy ATR settings hydration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-legacy-atr-settings-load.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch settings hydration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          needle = '      scan_interval_minutes: ([5, 15, 30].includes(Number((cfg as any).scan_interval_minutes)) ? Number((cfg as any).scan_interval_minutes) : 15) as 5 | 15 | 30,\n'
          insert = needle + '      legacy_atr_multipliers_enabled: !!(cfg as any).legacy_atr_multipliers_enabled,\n      legacy_sl_mult: Number((cfg as any).legacy_sl_mult ?? 1),\n      legacy_tp_mult: Number((cfg as any).legacy_tp_mult ?? 1),\n'
          if needle not in s:
              raise SystemExit('Target settings mapping not found')
          if 'legacy_atr_multipliers_enabled: !!(cfg as any).legacy_atr_multipliers_enabled' in s:
              raise SystemExit('Patch already applied')
          p.write_text(s.replace(needle, insert, 1))
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git rm .github/workflows/fix-legacy-atr-settings-load.yml
          git commit -m "fix: preserve legacy ATR settings on health refresh"
          git push origin main
