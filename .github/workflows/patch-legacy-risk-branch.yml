name: Patch legacy 15m ATR risk floor (temporary)
on:
  push:
    branches: [deploy/scanner-auth-refresh-2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/scanner-auth-refresh-2
          fetch-depth: 1
      - name: Patch scanner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/scan-signals/index.ts')
          s=p.read_text()
          old='''              const slDistance = Math.abs(raw.entry - raw.stop_loss) * Math.max(0.1, legacySlMult);\n              const tp1Distance = Math.abs(raw.tp1 - raw.entry) * Math.max(0.1, legacyTpMult);\n              const tp2Distance = Math.abs(raw.tp2 - raw.entry) * Math.max(0.1, legacyTpMult);'''
          new='''              // Anchor legacy stop risk to at least one full 15m ATR before applying the user multiplier.\n              const baseSlDistance = Math.max(Math.abs(raw.entry - raw.stop_loss), Math.abs(raw.atr));\n              const slDistance = baseSlDistance * Math.max(0.1, legacySlMult);\n              const tp1Distance = Math.abs(raw.tp1 - raw.entry) * Math.max(0.1, legacyTpMult);\n              const tp2Distance = Math.abs(raw.tp2 - raw.entry) * Math.max(0.1, legacyTpMult);'''
          if old not in s: raise SystemExit('legacy block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/scan-signals/index.ts
          git diff --cached --quiet || git commit -m 'fix: anchor legacy exits to 15m ATR floor'
          git push origin HEAD:deploy/scanner-auth-refresh-2
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-legacy-risk-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary legacy risk patch workflow'
          git push origin HEAD:deploy/scanner-auth-refresh-2