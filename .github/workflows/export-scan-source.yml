name: Export patched scanner source

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package scanner source
        run: |
          mkdir -p export/supabase/functions/scan-signals export/supabase/functions/_shared
          cp supabase/functions/scan-signals/index.ts export/supabase/functions/scan-signals/index.ts
          cp supabase/functions/_shared/auth.ts export/supabase/functions/_shared/auth.ts
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: patched-scan-signals
          path: export
      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/export-scan-source.yml
          git commit -m "chore: remove one-time source export workflow"
          git push
