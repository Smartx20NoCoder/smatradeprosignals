name: Stage temporary scanner bundle

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage private scanner bundle
        run: |
          set -e
          rm -rf public/__deploy_scan_7f1c9e
          mkdir -p public/__deploy_scan_7f1c9e/supabase/functions/scan-signals
          mkdir -p public/__deploy_scan_7f1c9e/supabase/functions/_shared
          cp supabase/functions/scan-signals/index.ts public/__deploy_scan_7f1c9e/supabase/functions/scan-signals/index.ts
          cp supabase/functions/_shared/auth.ts public/__deploy_scan_7f1c9e/supabase/functions/_shared/auth.ts
      - name: Commit staged bundle and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/__deploy_scan_7f1c9e
          git rm .github/workflows/stage-temp-scanner-bundle.yml
          git commit -m "chore: add temporary scanner deployment bundle"
          git push
