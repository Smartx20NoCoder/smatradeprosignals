name: Refresh temporary scanner deployment bundle

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh staged scanner source
        run: |
          set -e
          mkdir -p public/__deploy_scan_7f1c9e/supabase/functions/scan-signals
          mkdir -p public/__deploy_scan_7f1c9e/supabase/functions/_shared
          cp supabase/functions/scan-signals/index.ts public/__deploy_scan_7f1c9e/supabase/functions/scan-signals/index.ts
          cp supabase/functions/_shared/auth.ts public/__deploy_scan_7f1c9e/supabase/functions/_shared/auth.ts
      - name: Verify staged source is current
        run: |
          cmp supabase/functions/scan-signals/index.ts public/__deploy_scan_7f1c9e/supabase/functions/scan-signals/index.ts
          cmp supabase/functions/_shared/auth.ts public/__deploy_scan_7f1c9e/supabase/functions/_shared/auth.ts
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/__deploy_scan_7f1c9e
          git rm .github/workflows/refresh-deploy-bundle.yml
          git commit -m "chore: refresh scanner deployment bundle"
          git push
